name: CI - Test & Evaluation Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run unit tests
        run: pytest tests/ -v --ignore=tests/test_evaluation.py

      - name: Ingest sample docs into vector store
        run: python -m src.rag.ingestion.ingest --source data/raw

      - name: Run evaluation gate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        shell: bash
        run: |
          set -o pipefail
          python -m src.rag.evaluation.evaluate 2>&1 | tee evaluation_log.txt
        # This step fails the build (non-zero exit) if evaluation scores
        # drop below the regression_threshold set in configs/config.yaml,
        # or if any metric could not be graded (NaN). A summary table
        # (question / answer / per-metric scores) is also written to this
        # run's Summary tab automatically.

      - name: Upload full evaluation log
        if: always()   # upload even if the evaluation step failed
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-log
          path: evaluation_log.txt
